name: BIST Otomatik Piyasa Raporu

on:
  schedule:
    # Hafta içi HER GÜN (Pazartesi-Cuma -> 1-5):
    # TSİ 10:00 (Açılış Seansı) = UTC 07:00
    - cron: '0 7 * * 1-5'
    # TSİ 18:00 (Kapanış Seansı) = UTC 15:00
    - cron: '0 15 * * 1-5'
  workflow_dispatch: # İhtiyaç duyduğunda manuel çalıştırma butonu

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoriyi Çek
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy beautifulsoup4

      - name: BİST Analiz Botunu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
